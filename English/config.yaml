# FastSpeech 2, English (Svarah). One file replaces ming024's preprocess/model/train.yaml.
# Relative paths are resolved from the repository root.
language: en
dataset: Svarah

data:                      # used by English/preprocess.py prepare
  hf_dataset: ai4bharat/Svarah   # gated: accept terms on HF and export HF_TOKEN
  hf_split: test                 # Svarah only ships a "test" split (~9.6 h)
  audio_column: audio_filepath
  text_column: text
  train_hours: 5.5        # selection target before silence trimming / chunk drops;
  val_hours: 1.1          # post-processing hours are reported in features_summary.json
  min_dur: 1.0             # seconds
  max_dur: 30.0            # 11 s kept only 4.8 h (Svarah has many long clips); longer
                           # clips are aligned whole and split at pauses (preprocessing.chunking)
  min_words: 2
  min_speaker_minutes: 3.0 # speakers with less audio are not used
  gender: null             # null = both; "female"/"male" to restrict
  seed: 1234

path:
  raw_path: data/English/raw                 # wav + lab per speaker (MFA corpus)
  base_lexicon_path: fastspeech2/lexicon/librispeech-lexicon.txt
  lexicon_path: data/English/lexicon.txt     # alignment lexicon written by `prepare`
  textgrid_path: data/English/TextGrid       # MFA output
  preprocessed_path: data/English/preprocessed
  ckpt_path: English/checkpoints
  log_path: Results/English/others/logs
  result_path: Results/English

preprocessing:
  text:
    text_cleaners: []      # phones come from text/english.py, no upstream cleaners
  audio:
    sampling_rate: 22050   # Svarah is 16 kHz: upsampled; content above 8 kHz is empty
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000         # HiFi-GAN universal expects 0-8 kHz mels
  pitch:
    feature: phoneme_level
    normalization: true
    f0_floor: 65.0         # mixed male/female speakers
    f0_ceil: 500.0
  energy:
    feature: phoneme_level
    normalization: true
  chunking:                # split long aligned utterances at pauses
    enabled: true
    max_sec: 10.0          # < max_seq_len (1000 frames = 11.6 s)
    min_pause_sec: 0.15
    min_sec: 1.0

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: linear
    energy_quantization: linear
    n_bins: 256
  multi_speaker: true      # Svarah: many speakers -> speaker embedding table
  max_seq_len: 1000
  vocoder:
    model: HiFi-GAN
    speaker: universal     # pretrained, NOT fine-tuned on these speakers

train:
  optimizer:
    batch_size: 16
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps: [0.6, 0.8, 0.9]   # fractions of total_step (upstream: 300k/400k/500k of 900k)
    anneal_rate: 0.3
  step:
    total_step: 65000      # ~4.8 h at ~3.8 it/s (Kaggle T4, fp16, one language at a time); see README
    log_step: 100
    val_step: 1000
    save_step: 10000       # numbered checkpoints (keep_last newest kept)
    latest_step: 1000      # latest.pth.tar for resuming
    keep_last: 3
  misc:
    seed: 1234
    num_workers: 4
    group_size: 4
    amp: true              # fp16 autocast: 3.8 vs 1.7 it/s on a T4; same val loss in a GPU smoke test
    tensorboard: false

inference:
  speaker: auto            # speaker with the most training utterances
